name: Deploy Vite site to GitHub Pages

on:
  push:
    branches:
      - main
  schedule:
    # 10:00 UTC is 12:00 in Bratislava during summer time; 11:00 UTC is 12:00 in winter time.
    # The guard below allows only the DST candidate matching Bratislava's current UTC offset.
    - cron: "0 10 * * 1-3"
    - cron: "0 11 * * 1-3"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  refresh-window:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.local-time.outputs.should_deploy }}
    steps:
      - name: Check scheduled Slovak refresh window
        id: local-time
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE_EXPR: ${{ github.event.schedule }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" != "schedule" ]; then
            echo "Non-scheduled ${EVENT_NAME} run: deployment will proceed."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          bratislava_offset="$(TZ=Europe/Bratislava date '+%z')"

          case "$bratislava_offset" in
            +0200)
              expected_schedule="0 10 * * 1-3"
              ;;
            +0100)
              expected_schedule="0 11 * * 1-3"
              ;;
            *)
              expected_schedule=""
              ;;
          esac

          echo "Scheduled cron expression: ${SCHEDULE_EXPR}"
          echo "Europe/Bratislava UTC offset: ${bratislava_offset}"
          echo "Valid DST candidate cron expression: ${expected_schedule:-none}"

          if [ -n "$expected_schedule" ] && [ "$SCHEDULE_EXPR" = "$expected_schedule" ]; then
            echo "This scheduled run is the valid Bratislava noon DST candidate. Deployment will proceed."
            echo "should_deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "This scheduled run is not the valid Bratislava noon DST candidate. Deployment will be skipped."
            echo "should_deploy=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: refresh-window
    if: needs.refresh-window.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: npm run build
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Verify generated latest YouTube video data
        run: |
          node --input-type=module -e 'import { readFile } from "node:fs/promises"; const { sermon } = JSON.parse(await readFile("dist/data/latest-sermon.json", "utf8")); if (!sermon?.id || !sermon?.title) throw new Error("Latest YouTube video data was not generated."); console.log(`Latest YouTube video ready: ${sermon.title} (${sermon.id})`);'

      # GitHub Pages serves this copy for direct refreshes on client-side routes.
      - name: Add SPA fallback
        run: cp dist/index.html dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    if: needs.build.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
